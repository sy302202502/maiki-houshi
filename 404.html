<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - ページが見つかりません | 舞鬼法師</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0a08;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    .chara {
      width: 180px;
      height: auto;
      margin-bottom: 24px;
      filter: drop-shadow(0 10px 30px rgba(255, 107, 0, 0.25));
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      letter-spacing: 0.1em;
      color: #FF6B00;
      line-height: 1;
    }
    p { margin: 16px 0 32px; color: rgba(255,255,255,0.75); line-height: 1.8; }
    a.btn {
      display: inline-block;
      padding: 14px 36px;
      background: #FF6B00;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 4px;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/images/chibi-maiki.png" alt="舞鬼法師" class="chara">
    <h1>404</h1>
    <p>お探しのページは見つかりませんでした。<br>移動したか、削除された可能性があります。</p>
    <a href="/" class="btn">トップページへ戻る</a>
  </div>
</body>
</html>
