<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - ページが見つかりません | 舞鬼法師</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0b16">
  <link rel="icon" type="image/png" href="/assets/images/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 公式サイト（style.css）と同じ配色 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center;
      padding: 24px; text-align: center;
      color: #ece8f3; font-family: 'Noto Sans JP', sans-serif; line-height: 1.9;
      background:
        radial-gradient(50% 50% at 50% 35%, rgba(143, 99, 217, 0.35), transparent 70%),
        #0e0b16;
    }
    .wrap { max-width: 480px; }
    .chara { width: 150px; height: auto; margin: 0 auto 8px; display: block; }
    h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 6rem; line-height: 1; }
    .en { font-family: 'Cormorant Garamond', serif; font-style: italic; color: rgba(236, 232, 243, 0.6); letter-spacing: 0.08em; }
    p.msg { margin: 20px 0 32px; color: rgba(236, 232, 243, 0.72); }
    a.btn {
      display: inline-flex; align-items: center; min-height: 52px; padding: 0 30px; border-radius: 999px;
      background: #f2a93b; color: #1a1004; font-weight: 700; text-decoration: none; letter-spacing: 0.06em;
      transition: background 0.2s, transform 0.2s;
    }
    a.btn:hover { background: #ffc062; transform: translateY(-2px); }
    a.btn:focus-visible { outline: 2px solid #f2a93b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="/assets/images/chibi-maiki.webp" alt="" class="chara" width="421" height="510">
    <h1>404</h1>
    <p class="en">Page not found</p>
    <p class="msg">お探しのページは見つかりませんでした。<br>移動したか、削除された可能性があります。</p>
    <a href="/" class="btn">トップページへ戻る</a>
  </main>
</body>
</html>
