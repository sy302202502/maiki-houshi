<!doctype html><html lang="ja"><meta charset="utf-8">
<!-- 公式サイトのOGP画像（1200x630）の元。Chrome で 1200x630 に書き出して assets/images/og/og-image.png にする -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Noto+Sans+JP:wght@500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#120d1c;color:#f1ecf7;font-family:'Noto Sans JP',sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(700px 520px at 76% 45%,rgba(104,62,170,.55),transparent 65%),radial-gradient(600px 400px at 10% 100%,rgba(242,169,59,.10),transparent 60%),linear-gradient(180deg,#171024,#0e0a16)}
.kanji{position:absolute;right:20px;top:-18px;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:320px;line-height:1.02;color:rgba(190,160,240,.085);text-align:center}
.kv{position:absolute;right:70px;top:6px;height:1180px}
.left{position:absolute;left:72px;top:112px;width:560px}
.eyebrow{display:flex;align-items:center;gap:14px;color:#f2a93b;font-weight:700;font-size:23px;letter-spacing:.12em;white-space:nowrap}
.eyebrow:before{content:"";flex:0 0 34px;height:2px;background:currentColor}
.logo{display:block;width:430px;margin:18px 0 6px -14px}
.en{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:36px;letter-spacing:.24em;color:#d9d2e6}
.catch{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:52px;letter-spacing:.14em;margin-top:38px}
.url{position:absolute;left:72px;bottom:54px;font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.1em;color:#9d90b5}
</style>
<body><div class="bg"></div><div class="kanji">舞<br>鬼</div>
<img class="kv" src="../assets/images/kv-maiki.webp">
<div class="left"><div class="eyebrow">個人勢Vライバー／競馬予想・オリジナル曲</div>
<img class="logo" src="../assets/images/maiki-logo.png"><div class="en">MIKEY MASTER</div><div class="catch">舞う鬼、ここに。</div></div>
<div class="url">mikey-master.pages.dev</div></body></html>
