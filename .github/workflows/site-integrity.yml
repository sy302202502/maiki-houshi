name: Site integrity checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check site links, sitemap, canonical URLs and private routes
        run: python -m unittest discover -s tests -v
      - name: Check private-path middleware behavior (offline)
        run: node --test tests/middleware.test.mjs
